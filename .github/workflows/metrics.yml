name: Validate profile

on:
  push:
    paths:
      - README.md
      - scripts/**
      - .github/workflows/metrics.yml
      - .github/PROFILE-METRICS.md
  pull_request:
    paths:
      - README.md
      - scripts/**
      - .github/workflows/metrics.yml
      - .github/PROFILE-METRICS.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check curated profile without rewriting it
        run: |
          python3 -B scripts/update_profile.py --check
          python3 -B -m unittest discover -s scripts -p 'test_*.py'
